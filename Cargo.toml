[package]
name = "adbc_clickhouse"
version = "0.1.1"
edition = "2024"
description = "Official ClickHouse ADBC driver."
authors = [
    "Austin Bonander <austin.bonander@clickhouse.com>",
    "Serge Klochkov <serge.klochkov@clickhouse.com>"
]
# TODO: replace with ADBC client page on docs
homepage = "https://clickhouse.com/docs/integrations/rust"
repository = "https://github.com/clickhouse/adbc_clickhouse"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["lib", "cdylib"]

[features]
ffi = ["adbc_ffi"]

native-tls = ["clickhouse/native-tls"]

# Enable both a crypto provider (`rustls-tls-aws-lc`) and a root store
# (`rustls-tls-webpki-roots`), mirroring the `rustls-tls` feature of the
# underlying `clickhouse` crate.
rustls-tls = ["rustls-tls-aws-lc", "rustls-tls-webpki-roots"]
rustls-tls-aws-lc = [
    "clickhouse/rustls-tls-aws-lc",
    "hyper-rustls?/aws-lc-rs",
    "tls-mtls",
]
rustls-tls-ring = [
    "clickhouse/rustls-tls-ring",
    "hyper-rustls?/ring",
    "tls-mtls",
]
rustls-tls-native-roots = [
    "clickhouse/rustls-tls-native-roots",
    "hyper-rustls?/native-tokio",
]
rustls-tls-webpki-roots = [
    "clickhouse/rustls-tls-webpki-roots",
    "hyper-rustls?/webpki-tokio",
]
# Internal: enables the driver's custom TLS root bundle and mutual TLS support.
# It needs a crypto provider, so it is only ever turned on by
# `rustls-tls-aws-lc`/`rustls-tls-ring`.
tls-mtls = [
    "dep:rustls",
    "dep:hyper-rustls",
    "dep:hyper-util",
    "dep:rustls-pemfile",
]

[dependencies]
arrow-array = "58.3.0"
arrow-buffer = "58.3.0"
arrow-ipc = "58.3.0"
arrow-schema = "58.3.0"

adbc_core = "0.23.0"
adbc_ffi = { version = "0.23.0", optional = true }

clickhouse-types = "0.1.2"
clickhouse-ext-arrow = "0.1.0"

serde_bytes = "0.11.19"

tracing = "0.1.44"

url = "2.5.8"

[dependencies.clickhouse]
version = "0.15.2"

[dependencies.rand]
version = "0.10.1"
features = ["alloc"]

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.chrono]
version = "0.4.42"
features = ["serde"]

[dependencies.tokio]
version = "1.48.0"
features = ["rt"]

[dependencies.uuid]
version = "1.23.3"
features = ["serde"]

# Used to build a `rustls::ClientConfig` when the `rustls-tls-*` features are enabled.
[dependencies.hyper-rustls]
version = "0.27"
optional = true
default-features = false
features = ["http1", "tls12"]

[dependencies.hyper-util]
version = "0.1"
optional = true
features = ["client-legacy", "http1", "tokio"]

[dependencies.rustls]
version = "0.23"
optional = true
default-features = false

[dependencies.rustls-pemfile]
version = "2"
optional = true
features = ["std"]

[[test]]
name = "it"
path = "tests/it/main.rs"

[dev-dependencies]
arrow = "58.3.0"
adbc_driver_manager = "0.23.0"

[dev-dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "macros"]
